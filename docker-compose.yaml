services:
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: hits
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    depends_on: [garage]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
    volumes:
      - ./clickhouse/garage.xml:/etc/clickhouse-server/config.d/garage.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  jupyter:
    build: ./jupyter
    depends_on: [clickhouse]
    command: ["start-notebook.py", "--IdentityProvider.token="]
    volumes:
      - ./notebooks:/home/jovyan/work
    ports:
      - "127.0.0.1:8888:8888"

  dagster:
    build: ./dagster
    depends_on: [garage, clickhouse]
    environment:
      BATCHES_DIR: /data/batches
      S3_ENDPOINT: http://garage:3900
      S3_REGION: us-east-1
      S3_BUCKET: hits
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./pipeline:/app/pipeline:ro
      - ./sql:/app/sql:ro
      - ./data/batches:/data/batches:ro
      - dagster-home:/dagster_home
      - ./dagster/dagster.yaml:/dagster_home/dagster.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  garage-meta:
  garage-data:
  clickhouse-data:
  dagster-home:
